services:
  sshtunnelhub:
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/sshtunnelhub}:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sshtunnelhub
    restart: unless-stopped
    ports:
      # Web 管理后台端口
      - "9090:9090"
      # 预留正向隧道转发常用端口范围 (按需调整或扩展)
      - "10000-10050:10000-10050"
    environment:
      - PORT=9090
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
    volumes:
      # 数据持久化目录 (包含 SQLite 数据库及 AES-256 主密钥)
      - ./data:/data
    # 提示: 如果在 Linux 宿主机上运行且需要监听任意主机端口，建议直接启用 host 网络模式:
    # network_mode: "host"
