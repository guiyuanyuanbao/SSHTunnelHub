services:
  sshtunnelhub:
    image: ghcr.io/guiyuanyuanbao/sshtunnelhub:latest
    container_name: sshtunnelhub
    restart: unless-stopped
    ports:
      # Web 管理控制台端口
      - "9090:9090"
      # 预留正向隧道转发常用端口范围 (按需映射或根据业务增减)
      - "10000-10050:10000-10050"
    environment:
      - PORT=9090
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
      # 【全局访问秘钥】可选环境变量: 设置后强制启用口令认证保护; 若遗忘可在此直接修改并重启覆盖
      # - HUB_AUTH_KEY=YourStrongPassword2026!
    volumes:
      # 数据持久化目录 (包含 SQLite 数据库及 AES-256 主密钥)
      - ./data:/data

    # 【Linux 推荐部署模式 - Host 网络模式】
    # 如果部署在 Linux 宿主机上，且希望隧道随意监听宿主机任意端口，可注释掉上面的 ports 并取消下面的注释：
    # network_mode: host
